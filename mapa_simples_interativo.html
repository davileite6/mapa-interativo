<!DOCTYPE html>
<html lang="pt-BR" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Simples e Minimalista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #map-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background-color: #0284c7;
      cursor: grab;
    }
    #map-container:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .btn-icon {
      transition: all 0.2s ease;
    }
    .btn-icon:hover {
      transform: translateY(-1px);
    }
    .btn-icon:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body class="bg-sky-600 h-full w-full relative">

  <div id="map-container">
    <canvas id="map-canvas"></canvas>
  </div>

  <!-- Header / Title Badge -->
  <div class="absolute top-4 left-4 z-10 glass-panel rounded-2xl px-5 py-3 flex items-center space-x-3 pointer-events-auto">
    <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
    <div>
      <h1 class="text-sm font-bold text-slate-800 leading-tight">Mapa Minimalista</h1>
      <p class="text-xs text-slate-500">Sem nomes • Sem fronteiras • Água & Terra</p>
    </div>
  </div>

  <!-- Top Right Settings / Projection Controls -->
  <div class="absolute top-4 right-4 z-10 flex flex-col sm:flex-row gap-2 pointer-events-auto">
    <!-- Projection Switcher -->
    <div class="glass-panel rounded-2xl p-1.5 flex items-center space-x-1">
      <button id="btn-mercator" title="Visão Plana (Mercator)" class="btn-icon px-3 py-1.5 text-xs font-medium rounded-xl bg-blue-600 text-white shadow-sm flex items-center gap-1.5">
        <i class="fa-solid fa-map"></i>
        <span class="hidden sm:inline">Plano</span>
      </button>
      <button id="btn-natural" title="Visão Natural Earth" class="btn-icon px-3 py-1.5 text-xs font-medium rounded-xl text-slate-700 hover:bg-slate-100 flex items-center gap-1.5">
        <i class="fa-solid fa-earth-americas"></i>
        <span class="hidden sm:inline">Curvo</span>
      </button>
      <button id="btn-globe" title="Globo 3D" class="btn-icon px-3 py-1.5 text-xs font-medium rounded-xl text-slate-700 hover:bg-slate-100 flex items-center gap-1.5">
        <i class="fa-solid fa-globe"></i>
        <span class="hidden sm:inline">Globo 3D</span>
      </button>
    </div>

    <!-- Ocean Color Switcher -->
    <div class="glass-panel rounded-2xl p-2 flex items-center space-x-2">
      <span class="text-xs text-slate-500 font-medium px-1 hidden md:inline">Tom de Água:</span>
      <button data-color="#0284c7" class="color-btn w-6 h-6 rounded-full bg-sky-600 ring-2 ring-white ring-offset-1 hover:scale-110 transition-transform" title="Azul Céu"></button>
      <button data-color="#2563eb" class="color-btn w-6 h-6 rounded-full bg-blue-600 hover:scale-110 transition-transform" title="Azul Royal"></button>
      <button data-color="#0f172a" class="color-btn w-6 h-6 rounded-full bg-slate-900 hover:scale-110 transition-transform" title="Azul Noturno"></button>
      <button data-color="#0d9488" class="color-btn w-6 h-6 rounded-full bg-teal-600 hover:scale-110 transition-transform" title="Turquesa"></button>
    </div>
  </div>

  <!-- Bottom Right Navigation & Zoom Controls -->
  <div class="absolute bottom-6 right-6 z-10 flex flex-col gap-2 pointer-events-auto">
    <div class="glass-panel rounded-2xl p-1.5 flex flex-col space-y-1 shadow-lg">
      <button id="btn-zoom-in" title="Aproximar (+)" class="btn-icon w-10 h-10 rounded-xl flex items-center justify-center text-slate-700 hover:bg-slate-100 active:bg-slate-200">
        <i class="fa-solid fa-plus text-base"></i>
      </button>
      <div class="h-px bg-slate-200 my-0.5"></div>
      <button id="btn-zoom-out" title="Afastar (-)" class="btn-icon w-10 h-10 rounded-xl flex items-center justify-center text-slate-700 hover:bg-slate-100 active:bg-slate-200">
        <i class="fa-solid fa-minus text-base"></i>
      </button>
      <div class="h-px bg-slate-200 my-0.5"></div>
      <button id="btn-reset" title="Centralizar Mapa" class="btn-icon w-10 h-10 rounded-xl flex items-center justify-center text-slate-700 hover:bg-slate-100 active:bg-slate-200">
        <i class="fa-solid fa-compress text-base"></i>
      </button>
      <div class="h-px bg-slate-200 my-0.5"></div>
      <button id="btn-fullscreen" title="Tela Cheia" class="btn-icon w-10 h-10 rounded-xl flex items-center justify-center text-slate-700 hover:bg-slate-100 active:bg-slate-200">
        <i class="fa-solid fa-expand text-base"></i>
      </button>
    </div>
  </div>

  <!-- Bottom Left Coordinates Indicator -->
  <div class="absolute bottom-6 left-6 z-10 glass-panel rounded-xl px-3 py-1.5 pointer-events-none text-xs font-mono text-slate-600 hidden sm:block">
    <span id="coords-text">Lat: 0.00° | Long: 0.00°</span>
  </div>

  <script>
    // Global Application State
    const state = {
      projectionType: 'mercator', // 'mercator', 'natural', 'globe'
      oceanColor: '#0284c7',
      landColor: '#ffffff',
      scale: 1,
      rotation: [0, 0, 0], // [lambda, phi, gamma]
      translation: [0, 0],
      worldData: null,
      landFeature: null,
      width: window.innerWidth,
      height: window.innerHeight
    };

    // DOM Elements
    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('map-container');
    const coordsText = document.getElementById('coords-text');

    // Setup Canvas DPI & Sizing
    function resizeCanvas() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = state.width * dpr;
      canvas.height = state.height * dpr;
      ctx.scale(dpr, dpr);
      updateProjectionScale();
      render();
    }

    // Projections configuration
    let projection;
    let path = d3.geoPath().context(ctx);

    function getProjection() {
      const minDim = Math.min(state.width, state.height);
      if (state.projectionType === 'globe') {
        return d3.geoOrthographic()
          .scale((minDim / 2.2) * state.scale)
          .translate([state.width / 2 + state.translation[0], state.height / 2 + state.translation[1]])
          .rotate(state.rotation)
          .clipAngle(90);
      } else if (state.projectionType === 'natural') {
        return d3.geoNaturalEarth1()
          .scale((minDim / 3.2) * state.scale)
          .translate([state.width / 2 + state.translation[0], state.height / 2 + state.translation[1]])
          .rotate([state.rotation[0], 0, 0]);
      } else { // default mercator
        return d3.geoMercator()
          .scale((minDim / 6.2) * state.scale)
          .translate([state.width / 2 + state.translation[0], state.height / 2 + state.translation[1]])
          .rotate([state.rotation[0], 0, 0]);
      }
    }

    function updateProjectionScale() {
      projection = getProjection();
      path.projection(projection);
    }

    function render() {
      if (!state.landFeature) return;

      // Clear Canvas
      ctx.clearRect(0, 0, state.width, state.height);

      // 1. Draw Ocean Background
      container.style.backgroundColor = state.oceanColor;

      if (state.projectionType === 'globe') {
        // Draw Globe sphere background (clip ocean)
        ctx.beginPath();
        path({ type: 'Sphere' });
        ctx.fillStyle = state.oceanColor;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.stroke();
      }

      // 2. Draw Landmasses (Solid White, No borders, No labels)
      ctx.beginPath();
      path(state.landFeature);
      ctx.fillStyle = state.landColor;
      ctx.fill();

      // Smooth outer edges slightly with white stroke to prevent anti-aliasing artifacts
      ctx.lineWidth = 0.5;
      ctx.strokeStyle = state.landColor;
      ctx.stroke();
    }

    async function loadMapData() {
      try {
        // High resolution land geometry without country internal lines
        const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json');
        if (!response.ok) throw new Error('Data fetch failed');
        state.worldData = await response.json();
        // Extract continuous land polygons (zero internal territorial borders)
        state.landFeature = topojson.feature(state.worldData, state.worldData.objects.land);
        render();
      } catch (err) {
        console.warn('Fallback para dataset de menor resolução...', err);
        // Fallback to 110m map data if 50m fails
        const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json');
        state.worldData = await response.json();
        state.landFeature = topojson.feature(state.worldData, state.worldData.objects.land);
        render();
      }
    }

    let isDragging = false;
    let previousTouchPosition = null;

    // Zoom behavior with D3 Zoom
    const zoom = d3.zoom()
      .scaleExtent([0.5, 30])
      .on('zoom', (event) => {
        if (event.sourceEvent && event.sourceEvent.type === 'mousemove') {
          // Pan handling
          if (state.projectionType === 'globe') {
            const k = 360 / (Math.min(state.width, state.height) * state.scale);
            state.rotation[0] += event.sourceEvent.movementX * k * 0.3;
            state.rotation[1] -= event.sourceEvent.movementY * k * 0.3;
            state.rotation[1] = Math.max(-85, Math.min(85, state.rotation[1]));
          } else {
            state.translation[0] += event.sourceEvent.movementX;
            state.translation[1] += event.sourceEvent.movementY;
          }
        } else {
          // Wheel or gesture zoom
          state.scale = event.transform.k;
        }
        updateProjectionScale();
        render();
      });

    d3.select(canvas).call(zoom);

    // Mouse Movement / Pointer tracking for Lat/Long
    canvas.addEventListener('mousemove', (e) => {
      if (!projection) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const coords = projection.invert([x, y]);
      if (coords && !isNaN(coords[0]) && !isNaN(coords[1])) {
        const lat = coords[1].toFixed(2);
        const lon = coords[0].toFixed(2);
        coordsText.textContent = `Lat: ${lat}° | Long: ${lon}°`;
      } else {
        coordsText.textContent = `Lat: -- | Long: --`;
      }
    });

    // Projection Switchers
    const btnMercator = document.getElementById('btn-mercator');
    const btnNatural = document.getElementById('btn-natural');
    const btnGlobe = document.getElementById('btn-globe');

    function setActiveProjectionButton(activeBtn) {
      [btnMercator, btnNatural, btnGlobe].forEach(btn => {
        btn.className = "btn-icon px-3 py-1.5 text-xs font-medium rounded-xl text-slate-700 hover:bg-slate-100 flex items-center gap-1.5";
      });
      activeBtn.className = "btn-icon px-3 py-1.5 text-xs font-medium rounded-xl bg-blue-600 text-white shadow-sm flex items-center gap-1.5";
    }

    btnMercator.addEventListener('click', () => {
      state.projectionType = 'mercator';
      setActiveProjectionButton(btnMercator);
      updateProjectionScale();
      render();
    });

    btnNatural.addEventListener('click', () => {
      state.projectionType = 'natural';
      setActiveProjectionButton(btnNatural);
      updateProjectionScale();
      render();
    });

    btnGlobe.addEventListener('click', () => {
      state.projectionType = 'globe';
      setActiveProjectionButton(btnGlobe);
      updateProjectionScale();
      render();
    });

    // Ocean Color Buttons
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        state.oceanColor = e.currentTarget.dataset.color;
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-white', 'ring-offset-1'));
        e.currentTarget.classList.add('ring-2', 'ring-white', 'ring-offset-1');
        render();
      });
    });

    // Zoom Buttons
    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      state.scale *= 1.35;
      d3.select(canvas).transition().duration(250).call(zoom.scaleTo, state.scale);
      updateProjectionScale();
      render();
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      state.scale = Math.max(0.5, state.scale / 1.35);
      d3.select(canvas).transition().duration(250).call(zoom.scaleTo, state.scale);
      updateProjectionScale();
      render();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      state.scale = 1;
      state.translation = [0, 0];
      state.rotation = [0, 0, 0];
      d3.select(canvas).transition().duration(350).call(zoom.transform, d3.zoomIdentity);
      updateProjectionScale();
      render();
    });

    // Fullscreen Toggle
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Window Resize Event
    window.addEventListener('resize', resizeCanvas);

    // Initial Startup
    window.onload = () => {
      resizeCanvas();
      loadMapData();
    };
  </script>
</body>
</html>
